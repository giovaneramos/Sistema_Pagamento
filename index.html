<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="EVENTPAY - Plataforma cashless offline-first para eventos." />
  <title>EVENTPAY | Cashless para Eventos</title>
  <link rel="manifest" href="./manifest.webmanifest?v=8" />
  <link rel="icon" href="./assets/icon.svg?v=8" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css?v=8" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">EP</div>
        <div>
          <div class="brand-title">EVENTPAY</div>
          <div class="brand-subtitle">Cashless Offline-First</div>
        </div>
      </div>

      <div class="status-card" id="networkCard">
        <div class="status-row">
          <span class="status-label">Modo</span>
          <strong id="modeLabel">DEMO</strong>
        </div>
        <div class="status-row">
          <span class="status-label">Conexão</span>
          <strong id="onlineLabel" class="pill pill-success">Online</strong>
        </div>
        <div class="status-row">
          <span class="status-label">Sincronização</span>
          <strong id="syncLabel" class="pill pill-warning">Pendente</strong>
        </div>
      </div>

      <nav class="menu" id="menu"></nav>

      <div class="sidebar-footer">
        <div class="mini-note">Demo 100% executável em HTML/CSS/JS, pronto para GitHub Pages.</div>
        <a class="ghost-btn" href="./simulador-smartpos.html" style="display:inline-flex; margin-top:12px; justify-content:center; text-decoration:none;">Abrir simulador SmartPOS</a>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow" id="currentEventLabel">Evento atual</div>
          <h1 id="pageTitle">Dashboard Executivo</h1>
        </div>
        <div class="topbar-actions">
          <button class="ghost-btn" id="toggleNetworkBtn">Alternar rede</button>
          <button class="primary-btn" id="quickSyncBtn">Sincronizar agora</button>
        </div>
      </header>

      <section class="content" id="app"></section>
    </main>
  </div>

  <script src="./js/utils.js?v=8"></script>
  <script src="./data/mock-data.js?v=8"></script>
  <script src="./services/storage.js?v=8"></script>
  <script src="./services/sync-engine.js?v=8"></script>
  <script src="./services/domain.js?v=8"></script>
  <script src="./components/views.js?v=8"></script>
  <script src="./js/app.js?v=8"></script>
</body>
</html>
