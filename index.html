<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="EVENTPAY - Plataforma cashless offline-first para eventos." />
  <title>EVENTPAY | Cashless para Eventos</title>
  <link rel="manifest" href="./manifest.webmanifest?v=9" />
  <link rel="icon" href="./assets/icon.svg?v=9" type="image/svg+xml" />
  <style>
    :root{--bg:#07101f;--panel:#11192d;--panel-2:#0e1627;--line:rgba(148,163,184,.16);--text:#eff4ff;--muted:#97a5bf;--accent:#63e6ff;--accent-2:#7c3aed;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--shadow:0 24px 70px rgba(0,0,0,.35);--radius:22px;--radius-lg:28px;--font:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--text);background:radial-gradient(circle at top left,rgba(124,58,237,.2),transparent 25%),radial-gradient(circle at top right,rgba(99,230,255,.16),transparent 24%),linear-gradient(180deg,#050814 0%,#08111f 45%,#0b1020 100%)}body{overflow-x:hidden}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.shell{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}.sidebar{padding:24px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(10,15,29,.96),rgba(15,23,42,.94));display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:14px}.brand-mark{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-weight:900;letter-spacing:.08em;color:#07111f;background:linear-gradient(135deg,var(--accent),#b4fffb);box-shadow:0 0 0 6px rgba(99,230,255,.08)}.brand-title{font-size:1rem;font-weight:800;letter-spacing:.08em}.brand-subtitle,.muted,.mini-note{color:var(--muted)}.status-card,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(14px)}.status-card{padding:16px}.status-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;align-items:center}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:7px 12px;font-size:.8rem;font-weight:800}.pill.success{background:rgba(34,197,94,.12);color:#86efac}.pill.warning{background:rgba(245,158,11,.12);color:#fde68a}.pill.danger{background:rgba(239,68,68,.12);color:#fca5a5}.nav{display:grid;gap:10px;flex:1}.nav button,.ghost,.primary,.chip{border-radius:16px;padding:14px 16px;font-weight:800;transition:transform .16s ease,background .16s ease,border-color .16s ease}.nav button{color:var(--text);text-align:left;background:rgba(255,255,255,.04);border:1px solid transparent;display:flex;justify-content:space-between;align-items:center}.nav button.active{border-color:rgba(99,230,255,.28);background:linear-gradient(135deg,rgba(99,230,255,.12),rgba(124,58,237,.12))}.ghost{color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line)}.primary{color:#07111f;background:linear-gradient(135deg,var(--accent),#b0f7ff)}.chip{color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line)}.ghost:hover,.primary:hover,.chip:hover,.nav button:hover{transform:translateY(-1px)}.sidebar-footer{font-size:.9rem}.main{padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.eyebrow{color:var(--accent);letter-spacing:.18em;text-transform:uppercase;font-size:.75rem;margin-bottom:8px}.title{margin:0;font-size:clamp(1.55rem,2.8vw,2.35rem)}.actions{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kpi{padding:18px}.kpi .label{color:var(--muted)}.kpi .value{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:900;margin-top:10px;line-height:1}.kpi .trend{margin-top:10px;color:var(--accent);font-size:.84rem}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.panel{padding:20px}.panel-header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.panel h2,.panel h3{margin:0}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid rgba(148,163,184,.12);text-align:left;font-size:.94rem}.table th{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:#b8c4da}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:8px}.field label{font-size:.84rem;color:#c8d3e7}.field select,.field input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(15,23,42,.88);color:var(--text);outline:none}.alert{border-left:4px solid var(--accent);padding:14px 16px;border-radius:16px;background:rgba(99,230,255,.08)}.menu-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.menu-strip .chip{white-space:nowrap}.smartpos-shell{border-radius:28px;padding:18px;background:linear-gradient(180deg,rgba(17,24,39,.96),rgba(10,15,29,.98));border:1px solid rgba(99,230,255,.16);box-shadow:0 30px 80px rgba(0,0,0,.38)}.smartpos-screen{background:linear-gradient(180deg,rgba(8,12,23,.95),rgba(18,26,49,.92));border-radius:22px;padding:16px;border:1px solid rgba(148,163,184,.14)}.smartpos-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.smartpos-badge{font-weight:900;color:#07111f;background:linear-gradient(135deg,var(--accent),#c5fff9);border-radius:999px;padding:8px 12px}.touch-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.touch-large{min-height:54px}.amount{display:block;font-size:1.8rem;font-weight:900}.qr{width:170px;aspect-ratio:1;padding:12px;border-radius:18px;background:#fff;display:grid;gap:2px;grid-template-columns:repeat(21,1fr)}.qr span{border-radius:2px}.product-list{display:grid;gap:10px}.product-list.compact{max-height:33vh;overflow:auto;padding-right:4px}.product-row{width:100%;min-height:72px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#fff}.product-meta{display:grid;gap:4px;min-width:0}.product-meta strong{font-size:.98rem;line-height:1.2;color:#fff}.product-badge{font-size:.72rem;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}.product-plus{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;color:#07111f;font-weight:900;background:linear-gradient(135deg,var(--accent),#b0f7ff)}.cart-list{display:grid;gap:10px}.cart-list.compact{max-height:22vh;overflow:auto;padding-right:4px}.cart-item{display:flex;justify-content:space-between;gap:10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.04)}.cart-main{min-width:0}.cart-actions{display:flex;align-items:center;gap:10px}.cart-controls{display:flex;gap:8px}.cart-control{width:34px;height:34px;border-radius:999px;border:1px solid rgba(148,163,184,.18);background:rgba(255,255,255,.05);color:#fff;font-weight:900}.sticky-checkout{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;margin-top:16px;border-radius:20px;background:linear-gradient(180deg,rgba(7,11,22,.88),rgba(12,18,36,.96));border:1px solid rgba(99,230,255,.18);backdrop-filter:blur(14px)}.toast-area{position:fixed;right:20px;bottom:20px;display:grid;gap:10px;z-index:99}.toast{min-width:280px;max-width:360px;padding:14px 16px;border-radius:16px;background:rgba(9,14,28,.94);border:1px solid rgba(99,230,255,.18);box-shadow:var(--shadow)}.receipt{border-radius:20px;padding:18px;background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(230,236,245,.92));color:#111827}.timeline{display:grid;gap:12px}.timeline-item{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.04)}.dot{width:10px;height:10px;margin-top:6px;border-radius:999px;background:var(--accent);box-shadow:0 0 0 6px rgba(99,230,255,.12)}.compact details{border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);overflow:hidden}.compact details+details{margin-top:10px}.compact summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:800}.compact summary::-webkit-details-marker{display:none}.details-body{padding:0 16px 16px}.hidden{display:none}.sidebar .ghost{display:inline-flex;justify-content:center;text-decoration:none}.subtle{font-size:.84rem;color:var(--muted)}@media (max-width:1180px){.kpis,.layout{grid-template-columns:1fr 1fr}}@media (max-width:980px){.shell{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis,.layout,.field-grid{grid-template-columns:1fr}.topbar,.panel-header{flex-direction:column;align-items:flex-start}}@media (max-width:640px){.main,.sidebar{padding:16px}.nav{grid-template-columns:1fr}.actions{width:100%}.actions button,.actions a{flex:1}.touch-strip{grid-template-columns:1fr}.sticky-checkout{flex-direction:column;align-items:stretch}.cart-item{flex-direction:column}.qr{width:100%}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">EP</div>
        <div>
          <div class="brand-title">EVENTPAY</div>
          <div class="brand-subtitle">Cashless Offline-First</div>
        </div>
      </div>
      <div class="status-card">
        <div class="status-row"><span class="subtle">Modo</span><strong id="modeLabel">DEMO</strong></div>
        <div class="status-row"><span class="subtle">Conexão</span><strong id="onlineLabel" class="pill success">Online</strong></div>
        <div class="status-row"><span class="subtle">Sync</span><strong id="syncLabel" class="pill warning">Pendente</strong></div>
      </div>
      <nav class="nav" id="menu"></nav>
      <div class="sidebar-footer">
        <div class="mini-note">Demo 100% executável em HTML/CSS/JS e pronto para GitHub Pages.</div>
        <a class="ghost" href="./simulador-smartpos.html" style="margin-top:12px;">Abrir simulador SmartPOS</a>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow" id="currentEventLabel">Evento atual</div>
          <h1 class="title" id="pageTitle">Dashboard Executivo</h1>
        </div>
        <div class="actions">
          <button class="ghost" id="toggleNetworkBtn">Alternar rede</button>
          <button class="primary" id="quickSyncBtn">Sincronizar agora</button>
        </div>
      </header>
      <section id="app" class="grid"></section>
    </main>
  </div>
  <script>
    const currency = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
    const fmtMoney = v => currency.format(Number(v||0)).replace(/\u00a0/g,' ');
    const uid = (p='') => `${p}${crypto.randomUUID ? crypto.randomUUID() : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`}`;
    const state = JSON.parse(localStorage.getItem('eventpay_demo_state') || 'null') || (() => {
      const clients = ['Ana Martins','Bruno Costa','Carla Souza','Diego Lima','Fernanda Alves'].map((nome,i)=>({id:uid('cli_'),nome,cpf:`000.000.000-${10+i}`,phone:'+55 11 99999-0000'}));
      const cards = clients.map((client,i)=>({id:uid('card_'),clienteId:client.id,codigoNFC:`NFC-${String(i+1).padStart(4,'0')}-${Math.floor(1000+Math.random()*9000)}`,codigoQR:`QR-${String(i+1).padStart(4,'0')}-${Math.floor(1000+Math.random()*9000)}`,status:'ATIVO'}));
      return {route:'dashboard',online:true,selectedClientId:clients[0].id,selectedEventId:'evt_1',cart:[],amount:50,category:'Todos',clients,cards,products:[{id:uid('prd_'),codigo:'P001',descricao:'Coca-Cola 350ml',categoria:'Bebidas',valor:12},{id:uid('prd_'),codigo:'P002',descricao:'Água Mineral 500ml',categoria:'Bebidas',valor:6},{id:uid('prd_'),codigo:'P003',descricao:'Hambúrguer Artesanal',categoria:'Comidas',valor:28},{id:uid('prd_'),codigo:'P004',descricao:'Batata Frita',categoria:'Snacks',valor:18},{id:uid('prd_'),codigo:'P005',descricao:'Cerveja Premium',categoria:'Bebidas',valor:16},{id:uid('prd_'),codigo:'P006',descricao:'Snack Mix',categoria:'Snacks',valor:14},{id:uid('prd_'),codigo:'P007',descricao:'Café Especial',categoria:'Energia',valor:10},{id:uid('prd_'),codigo:'P008',descricao:'Acesso Lounge',categoria:'Experiência',valor:45},{id:uid('prd_'),codigo:'P009',descricao:'Hot Dog',categoria:'Comidas',valor:22}],wallets:Object.fromEntries(clients.map((c,i)=>[c.id,{saldo:60+(i*18)}])),sales:[{id:uid('sale_'),transactionId:uid('tx_'),entity:'VENDA',status:'SYNCED',createdAt:new Date(Date.now()-6*3600e3).toISOString(),clienteId:clients[0].id,valor:46,items:[{produtoId:'',quantidade:0}]}].slice(0,0),recargas:[{id:uid('rec_'),transactionId:uid('tx_'),entity:'RECARGA',status:'SYNCED',createdAt:new Date(Date.now()-3*3600e3).toISOString(),clienteId:clients[0].id,valor:80,formaPagamento:'PIX'}],syncs:[{id:uid('sync_'),transactionId:'tx_1',entity:'RECARGA',status:'SYNCED',data:new Date(Date.now()-3*3600e3).toISOString()},{id:uid('sync_'),transactionId:'tx_2',entity:'VENDA',status:'PENDING',data:new Date(Date.now()-1*3600e3).toISOString()}]}; })();
    const save = () => localStorage.setItem('eventpay_demo_state', JSON.stringify(state));
    const client = () => state.clients.find(c => c.id === state.selectedClientId) || state.clients[0];
    const card = () => state.cards.find(c => c.clienteId === client().id) || state.cards[0];
    const wallet = () => state.wallets[client().id] || { saldo: 0 };
    const products = () => state.category === 'Todos' ? state.products : state.products.filter(p => p.categoria === state.category);
    const menuItems = [
      ['dashboard','Dashboard Executivo','Receita e performance'],
      ['caixa','Recarga de Créditos','Tela do caixa'],
      ['pdv','Venda nas Barracas','Tela do vendedor'],
      ['sync','Sincronização','Fila offline-first'],
      ['config','Configurações','PWA e modos']
    ];
    const categories = ['Todos', ...new Set(state.products.map(p => p.categoria))];
    const menu = document.getElementById('menu');
    menu.innerHTML = menuItems.map(([route,title,sub]) => `<button data-route="${route}" class="${state.route===route?'active':''}"><span><strong>${title}</strong><br><small>${sub}</small></span><span>→</span></button>`).join('');
    const setRoute = route => { state.route = route; render(); save(); };
    const notify = (title, message) => { const host = document.querySelector('.toast-area') || (() => { const el = document.createElement('div'); el.className='toast-area'; document.body.appendChild(el); return el; })(); const t = document.createElement('div'); t.className='toast'; t.innerHTML = `<strong>${title}</strong><div class="muted">${message}</div>`; host.appendChild(t); setTimeout(() => t.remove(), 2600); };
    const calcMetrics = () => {
      const totalSales = state.sales.reduce((s,x)=>s + Number(x.valor||0),0);
      const countSales = state.sales.length;
      const openBalance = Object.values(state.wallets).reduce((s,w)=>s + Number(w.saldo||0),0);
      const avg = countSales ? totalSales / countSales : 0;
      return { totalSales, countSales, openBalance, avg };
    };
    const renderDashboard = () => {
      const m = calcMetrics();
      return `<div class="grid kpis">${[
        ['Faturamento', fmtMoney(m.totalSales), 'Receita total consolidada'],
        ['Vendas', String(m.countSales), 'Quantidade de vendas'],
        ['Saldo em aberto', fmtMoney(m.openBalance), 'Soma das carteiras'],
        ['Ticket médio', fmtMoney(m.avg), 'Valor médio por venda']
      ].map(([a,b,c]) => `<section class="card kpi"><div class="label">${a}</div><div class="value">${b}</div><div class="trend">${c}</div></section>`).join('')}</div>
      <div class="layout">
        <section class="card panel"><div class="panel-header"><div><h2>Resumo do evento</h2><div class="muted">Summer Beats 2026 - São Paulo Expo</div></div><span class="pill success">ATIVO</span></div><div class="alert"><strong>Operação em tempo real</strong><div class="muted">Caixa, recarga, PDV e sincronização com o mesmo núcleo de dados.</div></div></section>
        <section class="card panel"><div class="panel-header"><div><h2>Top produtos</h2><div class="muted">Mais vendidos no evento</div></div></div><table class="table"><thead><tr><th>Produto</th><th>Categoria</th><th>Qtd.</th></tr></thead><tbody>${state.products.slice(0,5).map((p,i)=>`<tr><td>${p.descricao}</td><td>${p.categoria}</td><td>${5-i}</td></tr>`).join('')}</tbody></table></section>
      </div>`;
    };
    const renderCaixa = () => {
      const c = client(); const w = wallet(); const cd = card(); const quick = [20,30,50,80,100,150];
      return `<section class="card smartpos-shell"><div class="smartpos-header"><div><div class="eyebrow">Recarga de Créditos</div><h2>Tela do Caixa</h2></div><div class="smartpos-badge">${state.online ? 'ONLINE' : 'OFFLINE'}</div></div><div class="smartpos-screen grid compact"><div class="card panel"><div class="panel-header"><div><h3>Identificação do cliente</h3><div class="muted">Toque para ler NFC ou QR</div></div><div class="actions"><button class="ghost" data-act="nfc">Ler NFC</button><button class="ghost" data-act="qr">Ler QR</button></div></div><div class="field-grid"><div class="card panel" style="padding:14px;"><div class="muted">Cliente</div><strong>${c.nome}</strong><div class="muted">${cd.codigoNFC} · ${cd.codigoQR}</div></div><div class="card panel" style="padding:14px;"><div class="muted">Saldo</div><strong class="amount">${fmtMoney(w.saldo)}</strong></div></div></div><div class="touch-strip">${quick.map(v=>`<button type="button" class="chip touch-large" data-act="amount" data-value="${v}">${fmtMoney(v)}</button>`).join('')}</div><div class="field-grid"><div class="field"><label>Cliente</label><select data-bind="client">${state.clients.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.nome}</option>`).join('')}</select></div><div class="field"><label>Forma de pagamento</label><select data-bind="pay"><option>PIX</option><option>DINHEIRO</option><option>CARTÃO</option></select></div></div><button class="primary touch-large" data-act="recharge">Confirmar recarga</button></div></section>`;
    };
    const cartTotal = () => state.cart.reduce((s,i)=>s + i.qtd * i.valor, 0);
    const renderPDV = () => {
      const c = client(); const w = wallet(); const cd = card(); const visible = products(); const cats = categories;
      const cartHtml = state.cart.length ? state.cart.map(item => { const p = state.products.find(x=>x.id===item.id); return `<div class="cart-item"><div class="cart-main"><strong>${p.descricao}</strong><div class="muted">${item.qtd} x ${fmtMoney(item.valor)}</div></div><div class="cart-actions"><strong>${fmtMoney(item.qtd*item.valor)}</strong><div class="cart-controls"><button class="cart-control" data-act="dec" data-id="${item.id}">-</button><button class="cart-control" data-act="rm" data-id="${item.id}">x</button></div></div></div>`; }).join('') : '<div class="muted">Carrinho vazio. Toque em produtos para iniciar a venda.</div>';
      return `<section class="card smartpos-shell"><div class="smartpos-header"><div><div class="eyebrow">Venda nas Barracas</div><h2>Tela do Vendedor</h2></div><div class="smartpos-badge">${state.online ? 'ONLINE' : 'OFFLINE'}</div></div><div class="smartpos-screen grid compact"><div class="card panel"><div class="panel-header"><div><h3>Identificação do cliente</h3><div class="muted">${cd.codigoNFC} · ${cd.codigoQR}</div></div><div class="actions"><button class="ghost" data-act="nfc">Ler NFC</button><button class="ghost" data-act="qr">Ler QR</button></div></div><div class="field-grid"><div class="card panel" style="padding:14px;"><div class="muted">Cliente</div><strong>${c.nome}</strong><div class="muted">CPF ${c.cpf}</div></div><div class="card panel" style="padding:14px;"><div class="muted">Saldo</div><strong class="amount">${fmtMoney(w.saldo)}</strong></div></div></div><div class="compact"><details open><summary>Trocar cliente</summary><div class="details-body"><div class="field"><label>Cliente</label><select data-bind="client">${state.clients.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.nome}</option>`).join('')}</select></div></div></details></div><div class="compact"><details open><summary>Produtos rápidos</summary><div class="details-body"><div class="menu-strip">${cats.map(cat=>`<button class="chip ${state.category===cat?'active':''}" data-act="filter" data-value="${cat}">${cat}</button>`).join('')}</div><div class="product-list compact">${visible.map(p=>`<button class="product-row" data-act="add" data-id="${p.id}"><div class="product-meta"><span class="product-badge">${p.categoria}</span><strong>${p.descricao}</strong></div><div class="product-meta"><strong>${fmtMoney(p.valor)}</strong><span class="product-plus">+</span></div></button>`).join('')}</div></div></details></div><div class="compact"><details open><summary>Carrinho (${state.cart.length})</summary><div class="details-body"><div class="cart-list compact">${cartHtml}</div></div></details></div><div class="sticky-checkout"><div><div class="muted">Total da venda</div><strong class="amount">${fmtMoney(cartTotal())}</strong></div><div class="actions"><button class="ghost" data-act="receipt">Comprovante</button><button class="primary" data-act="sale">Finalizar</button></div></div></div></section>`;
    };
    const renderSync = () => `<div class="layout"><section class="card panel"><div class="panel-header"><div><h2>Motor de sincronização</h2><div class="muted">Fila offline-first aguardando publicação</div></div><div class="actions"><button class="ghost" data-act="toggle">Alternar rede</button><button class="primary" data-act="sync">Sincronizar agora</button></div></div><div class="field-grid"><div class="card panel" style="padding:14px;"><div class="muted">Status da rede</div><strong>${state.online ? 'Online' : 'Offline'}</strong></div><div class="card panel" style="padding:14px;"><div class="muted">Fila</div><strong>${state.syncs.filter(s=>s.status==='PENDING').length}</strong></div></div></section><section class="card panel"><div class="panel-header"><div><h2>Últimos registros</h2><div class="muted">Vendas, recargas e sync</div></div></div><table class="table"><thead><tr><th>Entidade</th><th>Transação</th><th>Status</th></tr></thead><tbody>${state.syncs.slice(0,10).map(s=>`<tr><td>${s.entity}</td><td>${s.transactionId}</td><td><span class="pill ${s.status==='SYNCED'?'success':'warning'}">${s.status}</span></td></tr>`).join('')}</tbody></table></section></div>`;
    const renderConfig = () => `<div class="layout"><section class="card panel"><div class="panel-header"><div><h2>Configurações</h2><div class="muted">Pronto para PWA e evolução cloud</div></div></div><div class="alert"><strong>Roadmap</strong><div class="muted">React, React Native, FastAPI, PostgreSQL e SmartPOS Android.</div></div><div style="height:12px"></div><a class="primary" href="./simulador-smartpos.html" style="display:inline-flex;text-decoration:none;justify-content:center;">Abrir simulador SmartPOS</a></section><section class="card panel"><div class="timeline"><div class="timeline-item"><span class="dot"></span><div><strong>Offline First</strong><div class="muted">Continua operando sem internet com fila local.</div></div></div><div class="timeline-item"><span class="dot"></span><div><strong>Modo Local</strong><div class="muted">Servidor dentro do evento sem dependência externa.</div></div></div><div class="timeline-item"><span class="dot"></span><div><strong>Cloud</strong><div class="muted">Multi-eventos e multi-clientes.</div></div></div></div></section></div>`;
    function render(){ document.getElementById('pageTitle').textContent = menuItems.find(i=>i[0]===state.route)?.[1] || 'Dashboard Executivo'; document.getElementById('currentEventLabel').textContent = 'Summer Beats 2026 · São Paulo Expo'; document.getElementById('modeLabel').textContent = 'DEMO'; document.getElementById('onlineLabel').textContent = state.online ? 'Online' : 'Offline'; document.getElementById('onlineLabel').className = `pill ${state.online ? 'success' : 'danger'}`; document.getElementById('syncLabel').textContent = state.syncs.filter(s=>s.status==='PENDING').length ? `${state.syncs.filter(s=>s.status==='PENDING').length} pendente(s)` : 'Sincronizado'; document.getElementById('syncLabel').className = `pill ${state.syncs.some(s=>s.status==='PENDING') ? 'warning' : 'success'}`; document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.route===state.route)); const app = document.getElementById('app'); app.innerHTML = state.route==='dashboard' ? renderDashboard() : state.route==='caixa' ? renderCaixa() : state.route==='pdv' ? renderPDV() : state.route==='sync' ? renderSync() : renderConfig(); save(); }
    document.addEventListener('click', (e) => {
      const navBtn = e.target.closest('.nav button[data-route]'); if (navBtn) { setRoute(navBtn.dataset.route); return; }
      const act = e.target.closest('[data-act]'); if (!act) return;
      const id = act.dataset.id; const value = act.dataset.value;
      if (act.dataset.act === 'toggle') { state.online = !state.online; notify('Rede', state.online ? 'Rede restaurada.' : 'Modo offline ativado.'); render(); }
      if (act.dataset.act === 'sync') { state.syncs = state.syncs.map(s => s.status==='PENDING' ? {...s,status:'SYNCED',data:new Date().toISOString()} : s); notify('Sincronização concluída', 'Fila processada com sucesso.'); render(); }
      if (act.dataset.act === 'nfc') { state.selectedClientId = state.clients[0].id; notify('Leitura NFC', 'Cartão mockado identificado.'); render(); }
      if (act.dataset.act === 'qr') { state.selectedClientId = state.clients[1]?.id || state.selectedClientId; notify('Leitura QR', 'Código mockado reconhecido.'); render(); }
      if (act.dataset.act === 'amount') { state.amount = Number(value); render(); }
      if (act.dataset.act === 'receipt') { notify('Comprovante', 'Comprovante demo emitido.'); }
      if (act.dataset.act === 'recharge') { const amount = Number(state.amount || 0); const c = client(); state.wallets[c.id] = { saldo: Number(wallet().saldo) + amount }; state.recargas.unshift({ id: uid('rec_'), transactionId: uid('tx_'), entity:'RECARGA', status: state.online ? 'SYNCED' : 'PENDING', createdAt: new Date().toISOString(), clienteId:c.id, valor: amount }); state.syncs.unshift({ id: uid('sync_'), transactionId: uid('tx_'), entity:'RECARGA', status: state.online ? 'SYNCED' : 'PENDING', data:new Date().toISOString() }); state.cart=[]; notify('Recarga concluída', `${fmtMoney(amount)} adicionados para ${c.nome}.`); render(); }
      if (act.dataset.act === 'filter') { state.category = value; render(); }
      if (act.dataset.act === 'add') { const p = state.products.find(x=>x.id===id); const found = state.cart.find(x=>x.id===id); found ? found.qtd += 1 : state.cart.unshift({ id:p.id, qtd:1, valor:p.valor }); render(); }
      if (act.dataset.act === 'dec') { const item = state.cart.find(x=>x.id===id); if (!item) return; item.qtd > 1 ? item.qtd -= 1 : state.cart = state.cart.filter(x=>x.id!==id); render(); }
      if (act.dataset.act === 'rm') { state.cart = state.cart.filter(x=>x.id!==id); render(); }
      if (act.dataset.act === 'sale') { const total = cartTotal(); if (!state.cart.length) return notify('Carrinho vazio','Selecione produtos para iniciar a venda.'); const c = client(); const w = wallet(); if (w.saldo < total) return notify('Saldo insuficiente','Adicione créditos para concluir a compra.'); state.wallets[c.id] = { saldo: w.saldo - total }; state.sales.unshift({ id:uid('sale_'), transactionId:uid('tx_'), entity:'VENDA', status: state.online ? 'SYNCED' : 'PENDING', createdAt:new Date().toISOString(), clienteId:c.id, valor:total, items:[...state.cart] }); state.syncs.unshift({ id: uid('sync_'), transactionId: uid('tx_'), entity: 'VENDA', status: state.online ? 'SYNCED' : 'PENDING', data:new Date().toISOString() }); state.cart = []; notify('Venda registrada', `${fmtMoney(total)} debitado com sucesso.`); render(); }
    });
    document.addEventListener('change', (e) => { const select = e.target.closest('[data-bind]'); if (!select) return; if (select.dataset.bind === 'client') { state.selectedClientId = select.value; render(); } });
    document.getElementById('quickSyncBtn').addEventListener('click', () => { state.syncs = state.syncs.map(s => s.status==='PENDING' ? {...s,status:'SYNCED',data:new Date().toISOString()} : s); notify('Sincronização', 'Fila processada com sucesso.'); render(); });
    document.getElementById('toggleNetworkBtn').addEventListener('click', () => { state.online = !state.online; notify('Conectividade', state.online ? 'Rede restaurada.' : 'Rede simulada como offline.'); render(); });
    window.addEventListener('hashchange', () => { const next = (location.hash || '#dashboard').slice(1); state.route = ['dashboard','caixa','pdv','sync','config'].includes(next) ? next : 'dashboard'; render(); });
    menu.innerHTML = menuItems.map(([route,title,sub]) => `<button data-route="${route}" class="${state.route===route?'active':''}"><span><strong>${title}</strong><br><small>${sub}</small></span><span>→</span></button>`).join('');
    location.hash = state.route;
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
    render();
    document.getElementById('menu').addEventListener('click', (e) => { const btn = e.target.closest('button[data-route]'); if (btn) setRoute(btn.dataset.route); });
    save();
  </script>
</body>
</html>
